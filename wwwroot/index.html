<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>linkzin: encurte seus links</title>
  <meta name="description" content="Cole o link comprido e receba um linkzin. Sem cadastro.">
  <meta name="theme-color" content="#f6f7f2">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <a class="logo" href="/" aria-label="linkzin, página inicial">linkzin</a>
  </header>

  <main class="pagina">
    <div class="conteudo">
      <h1>
        <span class="larga">Cole o link comprido.</span>
        <span class="curta">Leve o linkzin.</span>
      </h1>

      <form id="form" class="form" novalidate>
        <label for="url">Endereço do link</label>
        <div class="campo">
          <input id="url" name="url" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://exemplo.com.br/pagina-gigante" required>
          <button id="go" type="submit">Encurtar</button>
        </div>
        <p id="erro" class="erro" role="alert" hidden></p>

        <div id="resultado" class="resultado" hidden>
          <p class="rotulo">Link encurtado</p>
          <div class="campo">
            <a id="curto" class="curto" target="_blank" rel="noopener"></a>
            <button id="copiar" type="button" class="copiar">Copiar</button>
          </div>
        </div>
      </form>

      <section id="recentes" class="recentes" hidden>
        <div class="recentes-topo">
          <h2>Seus links recentes</h2>
          <button id="limpar" type="button" class="limpar">Limpar lista</button>
        </div>
        <ul id="lista"></ul>
      </section>
    </div>

    <aside class="painel">
      <div id="azulejos" class="azulejos" aria-hidden="true"></div>
      <p class="legenda">O desenho dos azulejos muda a cada link encurtado.</p>
    </aside>
  </main>

  <footer class="rodape">Feito no Brasil</footer>

  <script src="app.js"></script>
</body>
</html>
